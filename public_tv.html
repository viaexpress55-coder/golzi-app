<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLZI TV — Liga en Vivo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#020408;color:#fff;font-family:'Barlow Condensed',sans-serif;overflow:hidden;height:100vh;width:100vw;}
  
  .topline{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#FFD700,#FFA500,#FFD700);animation:shimmer 2s infinite;}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  
  .header{display:flex;align-items:center;justify-content:space-between;padding:12px 32px;border-bottom:1px solid rgba(255,215,0,0.2);background:rgba(5,8,15,0.95);}
  .header-left{display:flex;align-items:center;gap:14px;}
  .logo{width:44px;height:44px;object-fit:contain;}
  .league-name{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#FFD700;letter-spacing:3px;}
  .league-sub{font-size:11px;color:#6B7A99;letter-spacing:2px;margin-top:2px;}
  .golzi-brand{font-family:'Bebas Neue',sans-serif;font-size:16px;color:rgba(255,215,0,0.4);letter-spacing:4px;}
  .clock{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#FFD700;letter-spacing:2px;}

  .main{display:flex;height:calc(100vh - 70px);}
  
  /* RANKING */
  .ranking-panel{flex:1;padding:20px 24px;overflow:hidden;border-right:1px solid rgba(255,215,0,0.1);}
  .panel-title{font-family:'Bebas Neue',sans-serif;font-size:16px;color:rgba(255,215,0,0.5);letter-spacing:4px;margin-bottom:16px;}
  
  .rank-item{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:12px;margin-bottom:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);transition:all 0.5s ease;}
  .rank-item.top1{background:rgba(255,215,0,0.12);border-color:rgba(255,215,0,0.4);box-shadow:0 0 20px rgba(255,215,0,0.1);}
  .rank-item.top2{background:rgba(192,192,192,0.08);border-color:rgba(192,192,192,0.3);}
  .rank-item.top3{background:rgba(205,127,50,0.08);border-color:rgba(205,127,50,0.3);}
  
  .rank-pos{font-family:'Bebas Neue',sans-serif;font-size:28px;color:rgba(255,215,0,0.4);width:36px;text-align:center;}
  .rank-medal{font-size:24px;width:36px;text-align:center;}
  .rank-flag{width:40px;height:28px;object-fit:cover;border-radius:3px;}
  .rank-name{flex:1;font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;letter-spacing:1px;}
  .rank-pts{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#FFD700;}
  .rank-pts-label{font-size:10px;color:#6B7A99;letter-spacing:1px;margin-left:2px;align-self:flex-end;margin-bottom:4px;}
  .rank-bar-wrap{width:100px;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;}
  .rank-bar{height:6px;background:linear-gradient(90deg,#FFD700,#FFA500);border-radius:3px;transition:width 1s ease;}

  /* LIVE PANEL */
  .live-panel{width:380px;padding:20px 24px;background:rgba(5,8,15,0.5);}
  .live-match{background:rgba(15,21,32,0.9);border:1px solid rgba(255,51,85,0.3);border-radius:16px;padding:16px;margin-bottom:12px;}
  .live-match.no-live{border-color:rgba(255,215,0,0.2);}
  .live-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,51,85,0.12);border:1px solid rgba(255,51,85,0.3);border-radius:20px;padding:4px 12px;margin-bottom:10px;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:#FF3355;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}
  .live-badge-txt{font-size:10px;color:#FF3355;font-weight:700;letter-spacing:2px;}
  
  .match-teams{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .match-team{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .match-flag{width:48px;height:34px;object-fit:cover;border-radius:4px;}
  .match-code{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#FFD700;letter-spacing:2px;}
  .match-score-box{display:flex;align-items:center;gap:8px;background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.2);border-radius:12px;padding:8px 16px;}
  .match-score{font-family:'Bebas Neue',sans-serif;font-size:48px;color:#fff;line-height:1;}
  .match-dash{font-family:'Bebas Neue',sans-serif;font-size:32px;color:#6B7A99;}
  .match-vs{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#6B7A99;}
  .match-minute{font-size:11px;color:#FF3355;font-weight:700;letter-spacing:1px;margin-top:6px;text-align:center;}
  
  .upcoming-title{font-size:10px;color:#6B7A99;letter-spacing:3px;margin:16px 0 10px;}
  .upcoming-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.03);margin-bottom:6px;border:1px solid rgba(255,255,255,0.05);}
  .upcoming-teams{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#fff;letter-spacing:1px;}
  .upcoming-time{font-size:11px;color:#00C6FF;font-weight:700;}

  .footer{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 32px;background:rgba(2,4,8,0.95);border-top:1px solid rgba(255,215,0,0.1);}
  .footer-code{font-size:11px;color:rgba(255,215,0,0.4);letter-spacing:2px;}
  .footer-update{font-size:10px;color:#6B7A99;}
  .footer-url{font-size:11px;color:rgba(255,215,0,0.3);letter-spacing:1px;}

  .no-live-msg{text-align:center;padding:30px 20px;}
  .no-live-icon{font-size:48px;margin-bottom:12px;}
  .no-live-txt{font-family:'Bebas Neue',sans-serif;font-size:20px;color:rgba(255,215,0,0.5);letter-spacing:2px;}
  .no-live-sub{font-size:12px;color:#6B7A99;margin-top:6px;}
</style>
</head>
<body>
<div class="topline"></div>

<div class="header">
  <div class="header-left">
    <img class="logo" src="https://firebasestorage.googleapis.com/v0/b/golzi-2026.firebasestorage.app/o/icon.png?alt=media&token=2fc09f84-4a1a-4717-8f35-ef0faa08f7c5" alt="GOLZI">
    <div>
      <div class="league-name" id="leagueName">GOLZI CUP</div>
      <div class="league-sub">MUNDIAL 2026 · PREDICCIONES</div>
    </div>
  </div>
  <div class="golzi-brand">GOLZI · PREDICE · COMPITE · GANA</div>
  <div class="clock" id="clock">00:00</div>
</div>

<div class="main">
  <div class="ranking-panel">
    <div class="panel-title">🏆 RANKING DE LA LIGA</div>
    <div id="rankingList">
      <div style="color:#6B7A99;font-size:14px;padding:20px;">Cargando ranking...</div>
    </div>
  </div>
  
  <div class="live-panel">
    <div class="panel-title">⚽ EN VIVO</div>
    <div id="liveContent">
      <div style="color:#6B7A99;font-size:14px;padding:20px;">Cargando partidos...</div>
    </div>
  </div>
</div>

<div class="footer">
  <div class="footer-code" id="footerCode">golzi.app</div>
  <div class="footer-update" id="lastUpdate">Actualizando...</div>
  <div class="footer-url">golzi.app · El juego de predicciones del Mundial</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, query, where, onSnapshot, orderBy, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyB8p-figRsYJNLh2KEHeJBIauoqrR8pVk0",
  authDomain: "golzi-2026.firebaseapp.com",
  projectId: "golzi-2026",
  storageBucket: "golzi-2026.firebasestorage.app",
  messagingSenderId: "466137327410",
  appId: "1:466137327410:web:4fbc9e9aa9df73ee52192b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Obtener código de la URL: golzi.app/tv/GOLZ-FCAP
const pathParts = window.location.pathname.split('/');
const leagueCode = pathParts[pathParts.length - 1]?.toUpperCase();

// Clock
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = 
    now.toLocaleTimeString('es-CO', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

// Cargar liga
async function loadLeague() {
  if (!leagueCode) return;
  document.getElementById('footerCode').textContent = 'golzi.app/tv/' + leagueCode;
  
  const q = query(collection(db, 'leagues'), where('code', '==', leagueCode));
  onSnapshot(q, async (snap) => {
    if (snap.empty) {
      document.getElementById('leagueName').textContent = 'LIGA NO ENCONTRADA';
      return;
    }
    const liga = snap.docs[0].data();
    document.getElementById('leagueName').textContent = liga.brandName || liga.name || 'GOLZI CUP';
    if (liga.brandLogo) {
      const logoEl = document.getElementById('headerLogo');
      if (logoEl) logoEl.src = liga.brandLogo;
    }
    if (liga.brandColor) {
      document.documentElement.style.setProperty('--brand-color', liga.brandColor);
      document.getElementById('leagueName').style.color = liga.brandColor;
    }
    
    // Cargar miembros con puntos
    const membersSnap = await getDocs(collection(db, 'leagues', snap.docs[0].id, 'members'));
    const members = membersSnap.docs.map(d => ({id:d.id, ...d.data()}));
    members.sort((a,b) => (b.totalPoints||0) - (a.totalPoints||0));
    
    const maxPts = members[0]?.totalPoints || 1;
    const medals = ['🥇','🥈','🥉'];
    
    const html = members.slice(0, 12).map((m, i) => {
      const pct = Math.round(((m.totalPoints||0) / maxPts) * 100);
      const cls = i===0?'top1':i===1?'top2':i===2?'top3':'';
      const flagUrl = m.country ? 
        `https://flagcdn.com/w40/${m.country.toLowerCase()}.png` : '';
      return `
        <div class="rank-item ${cls}">
          ${i < 3 
            ? `<div class="rank-medal">${medals[i]}</div>`
            : `<div class="rank-pos">${i+1}</div>`
          }
          ${flagUrl ? `<img class="rank-flag" src="${flagUrl}" onerror="this.style.display='none'">` : ''}
          <div class="rank-name">${m.username || m.displayName || 'Jugador'}</div>
          <div class="rank-bar-wrap"><div class="rank-bar" style="width:${pct}%"></div></div>
          <div class="rank-pts">${m.totalPoints||0}</div>
          <div class="rank-pts-label">PTS</div>
        </div>
      `;
    }).join('');
    
    document.getElementById('rankingList').innerHTML = html || '<div style="color:#6B7A99;padding:20px;">Sin jugadores aún</div>';
    document.getElementById('lastUpdate').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  });
}

// Cargar partidos en vivo
function loadLive() {
  const q = query(collection(db, 'live_matches'));
  onSnapshot(q, (snap) => {
    const matches = snap.docs.map(d => ({id:d.id,...d.data()}));
    const live = matches.filter(m => m.status==='IN_PLAY'||m.status==='PAUSED');
    const upcoming = matches.filter(m => m.status==='SCHEDULED'||m.status==='TIMED').slice(0,3);
    
    let html = '';
    
    if (live.length > 0) {
      live.forEach(m => {
        html += `
          <div class="live-match">
            <div class="live-badge">
              <div class="live-dot"></div>
              <span class="live-badge-txt">EN VIVO · ${m.minute||0}'</span>
            </div>
            <div class="match-teams">
              <div class="match-team">
                <img class="match-flag" src="https://flagcdn.com/w80/${getCountryCode(m.homeFlag)}.png" onerror="this.style.display='none'">
                <div class="match-code">${(m.homeTeam||'').slice(0,3).toUpperCase()}</div>
              </div>
              <div style="text-align:center">
                <div class="match-score-box">
                  <span class="match-score">${m.homeScore??0}</span>
                  <span class="match-dash">-</span>
                  <span class="match-score">${m.awayScore??0}</span>
                </div>
                <div class="match-minute">⏱ ${m.minute||0}' · ${(m.minute||0)<=45?'1er TIEMPO':'2do TIEMPO'}</div>
              </div>
              <div class="match-team">
                <img class="match-flag" src="https://flagcdn.com/w80/${getCountryCode(m.awayFlag)}.png" onerror="this.style.display='none'">
                <div class="match-code">${(m.awayTeam||'').slice(0,3).toUpperCase()}</div>
              </div>
            </div>
          </div>
        `;
      });
    } else {
      html += `
        <div class="live-match no-live">
          <div class="no-live-msg">
            <div class="no-live-icon">⚽</div>
            <div class="no-live-txt">SIN PARTIDOS EN VIVO</div>
            <div class="no-live-sub">Los partidos aparecerán aquí automáticamente</div>
          </div>
        </div>
      `;
    }
    
    if (upcoming.length > 0) {
      html += '<div class="upcoming-title">PRÓXIMOS PARTIDOS</div>';
      upcoming.forEach(m => {
        const time = m.utcDate ? new Date(m.utcDate).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}) : '';
        html += `
          <div class="upcoming-item">
            <div class="upcoming-teams">${(m.homeTeam||'').slice(0,3).toUpperCase()} vs ${(m.awayTeam||'').slice(0,3).toUpperCase()}</div>
            <div class="upcoming-time">${time}</div>
          </div>
        `;
      });
    }
    
    document.getElementById('liveContent').innerHTML = html;
  });
}

function getCountryCode(flag) {
  const codes = {
    '🇲🇽':'mx','🇿🇦':'za','🇰🇷':'kr','🇨🇿':'cz','🇨🇦':'ca','🇧🇦':'ba',
    '🇶🇦':'qa','🇨🇭':'ch','🇧🇷':'br','🇲🇦':'ma','🇭🇹':'ht','🇺🇸':'us',
    '🇵🇾':'py','🇦🇺':'au','🇹🇷':'tr','🇩🇪':'de','🇨🇮':'ci','🇪🇨':'ec',
    '🇳🇱':'nl','🇯🇵':'jp','🇹🇳':'tn','🇸🇪':'se','🇧🇪':'be','🇪🇬':'eg',
    '🇮🇷':'ir','🇳🇿':'nz','🇪🇸':'es','🇸🇦':'sa','🇺🇾':'uy','🇫🇷':'fr',
    '🇸🇳':'sn','🇳🇴':'no','🇮🇶':'iq','🇦🇷':'ar','🇩🇿':'dz','🇦🇹':'at',
    '🇯🇴':'jo','🇵🇹':'pt','🇨🇩':'cd','🇺🇿':'uz','🇨🇴':'co','🇭🇷':'hr',
    '🇬🇭':'gh','🇵🇦':'pa',
  };
  return codes[flag] || 'un';
}

loadLeague();
loadLive();
</script>
</body>
</html>
